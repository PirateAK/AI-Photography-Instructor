[project]
name = "ai-photography-instructor"
version = "0.1.0"
description = "Interactive AI Photo Coach — upload a photo, get structured feedback, and learn camera settings with a live simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pillow>=10.4",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "httpx>=0.27",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "piexif>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
